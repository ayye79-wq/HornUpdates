name: Collect AI news candidates

on:
  workflow_dispatch:
  schedule:
    - cron: '17 11,19 * * *'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect candidates
        run: node scripts/collect-ai-news.mjs
      - name: Commit inbox changes
        run: |
          if git diff --quiet -- data/ai-inbox.json; then
            echo 'No inbox changes.'
            exit 0
          fi
          git config user.name 'hornupdates-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/ai-inbox.json
          git commit -m 'Refresh AI news candidate inbox'
          git push
