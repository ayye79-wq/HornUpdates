name: Validate publication

on:
  pull_request:
    paths:
      - 'index.html'
      - 'signal-brief.html'
      - 'signal/**'
      - 'data/signal.json'
      - 'editorial-policy.html'
      - 'feed.xml'
      - 'sitemap.xml'
      - 'scripts/**'
      - '.github/workflows/validate-publication.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'signal-brief.html'
      - 'signal/**'
      - 'data/signal.json'
      - 'feed.xml'
      - 'sitemap.xml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate The Signal and generated pages
        run: node scripts/validate-publication.mjs
