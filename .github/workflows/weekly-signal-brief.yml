name: Signal Brief Editorial Check

on:
  # A date must not advance without a human review of the underlying brief.
  workflow_dispatch:

jobs:
  check-brief:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_GITHUB }}

      - name: Preview What to Watch bullets (editor reference — not written to file)
        run: python3 scripts/prefill_what_to_watch.py

      - name: Confirm this workflow does not publish
        run: git diff --exit-code
