name: Publish HornUpdates AI Short

on:
  workflow_dispatch:
    inputs:
      privacy:
        description: YouTube visibility for this run
        required: true
        default: public
        type: choice
        options: [public, private, unlisted]
  schedule:
    - cron: '12 17 * * *'

permissions:
  contents: write

concurrency:
  group: hornupdates-youtube-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY_STATUS: ${{ inputs.privacy || 'public' }}
      HORNUDATES_VOICE: en-US-AvaNeural
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-video.txt
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install Python dependencies
        run: pip install -r requirements-video.txt
      - name: Render and publish one verified story
        run: python scripts/youtube_video_agent.py
      - name: Commit publishing state
        run: |
          if git diff --quiet -- data/youtube-video-state.json; then
            echo 'No publishing state change.'
            exit 0
          fi
          git config user.name 'hornupdates-video-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/youtube-video-state.json
          git commit -m 'Record published HornUpdates YouTube Short'
          git push
      - name: Preserve rendered video for seven days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hornupdates-youtube-video
          path: build/youtube/*.mp4
          if-no-files-found: ignore
          retention-days: 7

