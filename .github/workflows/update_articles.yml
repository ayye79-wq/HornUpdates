name: Update Articles

on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_GITHUB }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install feedparser openai

      # AI remains available for tagging, source discovery, background context,
      # and metadata. Opinion publishing requires a named contributor and review.
      - name: Update reporting feed and editorial metadata
        run: python update_articles.py

      - name: Sync reviewed author pages
        run: python sync_author_pages.py

      - name: Regenerate redirects
        run: python update_redirects.py

      - name: Commit and push non-opinion newsroom updates
        run: |
          git config user.name "Horn Updates Bot"
          git config user.email "bot@hornupdates.com"
          git add articles.json explainer-*.html author-*.html sitemap.xml robots.txt _redirects unmapped_authors.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update reporting feed and metadata $(date -u '+%Y-%m-%d %H:%M UTC') [skip actions]"
            git pull --rebase origin main
            git push
          fi
