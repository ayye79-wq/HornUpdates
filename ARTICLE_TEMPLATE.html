<!doctype html>
<!-- Editorial template: copy for reviewed Analysis, Explainer, or Opinion pages. -->
<html lang="en"><head>
<script src="/consent-default.js"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}} | Horn Updates</title><meta name="description" content="{{DEK}}"><link rel="canonical" href="https://hornupdates.com/{{SLUG}}.html">
<meta property="og:type" content="article"><meta property="og:title" content="{{TITLE}}"><meta property="og:description" content="{{DEK}}"><meta property="og:url" content="https://hornupdates.com/{{SLUG}}.html"><meta property="og:image" content="{{IMAGE_URL}}"><meta property="article:published_time" content="{{PUBLISHED_ISO}}"><meta property="article:modified_time" content="{{UPDATED_ISO}}">
<meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="{{TITLE}}"><meta name="twitter:description" content="{{DEK}}">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"Article","headline":"{{TITLE}}","description":"{{DEK}}","datePublished":"{{PUBLISHED_ISO}}","dateModified":"{{UPDATED_ISO}}","author":{"@type":"Person","name":"{{AUTHOR}}","url":"{{AUTHOR_URL}}"},"publisher":{"@type":"Organization","name":"Horn Updates","url":"https://hornupdates.com"},"mainEntityOfPage":"https://hornupdates.com/{{SLUG}}.html","image":"{{IMAGE_URL}}","articleSection":"{{CONTENT_TYPE}}"}</script>
<link rel="stylesheet" href="/redesign.css"></head><body>
<!-- Required order: label, title, dek, author, dates, body, sources, related, corrections. -->
<main class="article-shell"><span class="label">{{CONTENT_TYPE}}</span><h1>{{TITLE}}</h1><p class="dek">{{DEK}}</p><div class="byline">By <a href="{{AUTHOR_URL}}">{{AUTHOR}}</a><br><span class="meta">Published {{PUBLISHED}} · Updated {{UPDATED}}</span></div><article class="article-body">{{BODY}}<h2>Sources and further reading</h2>{{SOURCES}}<h2>Related reading</h2>{{RELATED}}</article><div class="corrections"><strong>Corrections:</strong> {{CORRECTIONS_NOTE}}</div></main>
<script src="/cookie-consent.js"></script>
</body></html>
